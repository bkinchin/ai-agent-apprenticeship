# Who to reach, and how.
#
# Structured rather than narrative because every field has exactly one
# right value — day 9's test: could two reasonable people read this and
# disagree? No. So it is a lookup, not a document.
#
# It exists because the abstention branch routes ("ask the pro shop")
# and until now nothing could turn that into something a member could
# act on. The renderer had a phone number HARDCODED IN THE SOURCE, which
# is an invented club fact in member-facing text — the exact thing the
# citation machinery exists to prevent, sitting in the one place nobody
# thought to check.

meaning: >
